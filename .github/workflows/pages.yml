name: Publiser nettsiden

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Eget domene: follobjorkeved.no (CNAME-filen under forteller GitHub Pages hvilket domene siden har).
      - name: Sett adressen til siden
        run: |
          echo "SITE_URL=https://follobjorkeved.no" >> "$GITHUB_ENV"
          echo "BASE_PATH=" >> "$GITHUB_ENV"
      - run: python3 build.py
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
          cname: follobjorkeved.no
      # Varsler Bing (og dermed ChatGPT-søk/Copilot) om alle sidene via IndexNow.
      - name: Varsle Bing via IndexNow
        continue-on-error: true
        run: |
          sleep 60
          urls=$(grep -o '<loc>[^<]*' public/sitemap.xml | sed 's/<loc>//' | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          curl -sS -m 30 -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"follobjorkeved.no\",\"key\":\"e81064f97a600ac2437dd7b14caf8227\",\"keyLocation\":\"https://follobjorkeved.no/e81064f97a600ac2437dd7b14caf8227.txt\",\"urlList\":$urls}" \
            -w "IndexNow svarte: %{http_code}\n"
