name: Publiser nettsiden

on:
  push:
    branches: [main, claude/practical-rubin-6ubv77]
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Leser siden sin adresse fra GitHub, så lenker blir riktige både på
      # github.io og etter at eget domene er koblet til.
      - name: Finn adressen til siden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url 2>/dev/null || echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/")
          url=${url%/}
          path=$(echo "$url" | sed -E 's#^https?://[^/]+##')
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
          echo "BASE_PATH=$path" >> "$GITHUB_ENV"
          echo "Publiserer til $url (base: '$path')"
      - run: python3 build.py
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
