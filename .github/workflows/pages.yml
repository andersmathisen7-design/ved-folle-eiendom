name: Publiser nettsiden

on:
  push:
    branches: [main, claude/practical-rubin-6ubv77]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Eget domene: follobjorkeved.no (CNAME-filen under forteller GitHub Pages hvilket domene siden har).
      - name: Sett adressen til siden
        run: |
          echo "SITE_URL=https://follobjorkeved.no" >> "$GITHUB_ENV"
          echo "BASE_PATH=" >> "$GITHUB_ENV"
      - run: python3 build.py
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
          cname: follobjorkeved.no
